default_profile = "local"

# Zástupné hodnoty: zadejte model skutečně dostupný na vaší adrese.
[profiles.local]
protocol = "chat_completions"
chat_dialect = "ollama"
base_url = "http://127.0.0.1:11434/v1"
model = "REPLACE_WITH_LOCAL_MODEL"
auth = "none"
context_window = 32768
max_output_tokens = 4096

[profiles.openai]
protocol = "responses"
model = "REPLACE_WITH_MODEL"
api_key_env = "OPENAI_API_KEY"
context_window = 32768
max_output_tokens = 4096
thinking_format = "content_block"
thinking_in_history = true

[profiles.anthropic]
protocol = "anthropic"
model = "REPLACE_WITH_MODEL"
api_key_env = "ANTHROPIC_API_KEY"
context_window = 32768
max_output_tokens = 4096
thinking_format = "content_block"
thinking_in_history = true

# Další kompatibilní služby: přidejte profil s vlastní hodnotou base_url,
# model, api_key_env a skutečnými limity kontextu. Automatický náhradní model není nastaven.
# Modely bez nativního volání nástrojů mohou použít tool_mode = "text".
# Vlastní protokoly: protocol = "custom", factory = "your_package:build_client".
