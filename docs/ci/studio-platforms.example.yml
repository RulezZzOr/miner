name: Studio platform checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  clean-install:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            archive: linux.tar.gz
          - os: macos-latest
            archive: macos.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: sh setup-studio
      - run: frontier/.venv/bin/python scripts/build_release.py
      - name: Install archive, exercise HTTP and run backend regressions
        run: frontier/.venv/bin/python scripts/smoke_release.py dist/switch-studio-$(cat studio/VERSION)-${{ matrix.archive }} --suite
      - name: Frontend regressions
        run: node --test studio/tests/*.cjs
