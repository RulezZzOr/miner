# Modified for Miner / Switch Studio, 2026-09-23.
# Changes from ApodexAI/FrontierAgent; see frontier/SWITCH.md and THIRD_PARTY.md at the repository root.
# Switch fork: workflow profile can be supplied by the model-profile launcher.
name: agent_team
description: "Native Agent Team workflow: coordinator delegates web-enabled work to sub-agents."

workflow: agent_team
workflow_profile: ${SWITCH_TEAM_PROFILE:-tui}

llm:
  workflow_profile: ${SWITCH_TEAM_PROFILE:-}
  provider: ${OPENAI_PROVIDER:-openai}
  model: ${OPENAI_MODEL}
  base_url: ${OPENAI_BASE_URL}
  api_key: ${OPENAI_API_KEY}
  temperature: 1.0
  max_tokens: ${OPENAI_MAX_TOKENS:-32768}
  context_window: ${OPENAI_CONTEXT_WINDOW:-262144}
# Turn budgets live in the selected workflow profile. ``agent.max_turns`` here
# would configure apodex's generic loop, which workflow dispatch does not run.
# No ``tools:`` here on purpose. Workflow dispatch never calls
# ``profile.tools()``; the coordinator's orchestration tools and its
# sub-agents' web/file tools are the allowlists in
# workflows/agent_team/profiles/tui.yaml, and a second copy here could only
# drift out of step with them.
skills: []
